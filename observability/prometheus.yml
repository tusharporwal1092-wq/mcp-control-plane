# Scrapes the OTel collector's Prometheus exporter (see
# observability/otel-collector-config.yaml) - the gateway itself never
# exposes a /metrics endpoint, it only ever pushes OTLP to the collector.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
