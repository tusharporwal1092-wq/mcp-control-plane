{{- if .Values.externalSecrets.enabled }}
# Syncs Secrets Manager into one K8s Secret (mcp-gateway-secrets), keyed
# exactly as the gateway container's env vars (deployment.yaml's `envFrom:
# secretRef` picks them up with no per-var wiring) - requires the External
# Secrets Operator's CRDs/controller already in the cluster
# (terraform/helm.tf installs it).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: mcp-gateway-secretstore
  namespace: {{ .Values.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }} # IRSA (terraform/iam.tf's mcp-gateway-role) - no static AWS credential anywhere in this chart
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcp-gateway-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mcp-gateway-secretstore
    kind: SecretStore
  target:
    name: mcp-gateway-secrets
    creationPolicy: Owner
    # `data` below only supplies *input* to this template (accessible via
    # ESO's own template variables, one per secretKey) - with
    # `target.template` set, ESO writes exactly (and only) what's declared
    # here, so DATABASE_URL/JENKINS_USER/etc. all have to be re-declared
    # even for the ones that don't need any transformation (REDIS_URL,
    # JENKINS_USER, ...), not just DATABASE_URL.
    #
    # CAUTION for whoever edits this block: it's rendered twice, by two
    # different template engines that both happen to use the same
    # double-curly-brace action syntax. Helm renders it first - a plain
    # value reference like the RDS host below becomes the real hostname,
    # literally, in the manifest Helm produces. The pieces meant for ESO's
    # own template variables need to survive that first pass completely
    # unevaluated, so ESO's Go-template engine can evaluate *them* later,
    # at secret-sync time, against the values it just pulled via `data:`
    # below - not against any Helm value (Helm has no idea what a database
    # password is, and would error trying to look one up on its own root
    # context). Below, each ESO-facing placeholder is wrapped in a Go
    # raw-string literal (backtick-quoted) so Helm emits it as inert text
    # instead of attempting to evaluate it as one of Helm's own actions,
    # while the Helm-facing values around it (the RDS host/port/dbName)
    # render normally in the same pass. Both halves are real uses of the
    # same action syntax, just consumed by two different engines at two
    # different times - that split, not a typo, is why this looks doubled up.
    template:
      data:
        DATABASE_URL: "postgresql://{{ `{{ .dbUsername }}` }}:{{ `{{ .dbPassword }}` }}@{{ .Values.rds.host }}:{{ .Values.rds.port }}/{{ .Values.rds.dbName }}"
        REDIS_URL: "{{ `{{ .redisUrl }}` }}"
        JENKINS_USER: "{{ `{{ .jenkinsUser }}` }}"
        JENKINS_API_TOKEN: "{{ `{{ .jenkinsApiToken }}` }}"
        SLACK_SIGNING_SECRET: "{{ `{{ .slackSigningSecret }}` }}"
        SLACK_WEBHOOK_URL: "{{ `{{ .slackWebhookUrl }}` }}"
  data:
    - secretKey: dbUsername
      remoteRef:
        key: {{ .Values.dbSecretArn }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.dbSecretArn }}
        property: password
    - secretKey: redisUrl
      remoteRef:
        key: mcp-control-plane/{{ .Values.environment }}/redis-url
        property: redis_url
    - secretKey: jenkinsUser
      remoteRef:
        key: mcp-control-plane/{{ .Values.environment }}/jenkins-token
        property: jenkins_user
    - secretKey: jenkinsApiToken
      remoteRef:
        key: mcp-control-plane/{{ .Values.environment }}/jenkins-token
        property: jenkins_api_token
    - secretKey: slackSigningSecret
      remoteRef:
        key: mcp-control-plane/{{ .Values.environment }}/slack-signing-secret
        property: slack_signing_secret
    - secretKey: slackWebhookUrl
      remoteRef:
        key: mcp-control-plane/{{ .Values.environment }}/slack-signing-secret
        property: slack_webhook_url
{{- end }}
