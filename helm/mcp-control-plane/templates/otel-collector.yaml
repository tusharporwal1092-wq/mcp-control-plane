{{- if .Values.otelCollector.enabled }}
# Separate single-replica Deployment (not a sidecar) per
# docs/architecture.md's deployment diagram - every gateway pod pushes OTLP
# to this one collector over the cluster-internal Service below (see
# deployment.yaml's OTEL_EXPORTER_OTLP_ENDPOINT), same pipeline shape as
# Phase 6's local docker-compose stack (observability/otel-collector-config.yaml),
# just retargeted at a configurable external backend instead of the local
# tempo/prometheus containers - see values.yaml's otelCollector.exportEndpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-otel-collector-config
  namespace: {{ .Values.namespace }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      logging:
        verbosity: basic
      {{- if .Values.otelCollector.exportEndpoint }}
      otlp:
        endpoint: {{ .Values.otelCollector.exportEndpoint | quote }}
        tls:
          insecure: false
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ if .Values.otelCollector.exportEndpoint }}otlp{{ else }}logging{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ if .Values.otelCollector.exportEndpoint }}otlp{{ else }}logging{{ end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-otel-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1 # docs/architecture.md: "Deployment: otel-collector (1 replica)"
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-otel-collector
      annotations:
        # Forces a pod restart when the collector config actually changes -
        # hashes just the values that feed the ConfigMap above, not the
        # rendered file itself (that would `include` this same template,
        # which is already mid-render at this point -> infinite recursion,
        # caught by `helm lint`).
        checksum/config: {{ .Values.otelCollector | toYaml | sha256sum }}
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image }}
          args: ["--config=/etc/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: mcp-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-otel-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
