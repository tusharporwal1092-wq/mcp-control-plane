name: Audit Log S3 Export

# Runs scripts/export_audit_to_s3.py (docs/roadmap.md Phase 5) daily against
# whatever Postgres/S3 the AUDIT_LOG_* secrets below point at. No deployed
# environment exists for this project yet (Phase 7 - Infrastructure as Code -
# hasn't started), so until those secrets are configured in the repo this
# workflow intentionally no-ops rather than failing loudly every night.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC - well after the UTC day being exported has fully elapsed
  workflow_dispatch: {} # also runnable manually from the Actions tab, for testing/backfill

jobs:
  export:
    name: export prior day's audit_log to S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Only runs the actual export when the bucket secret is present; the
      # complementary "Not configured" step below covers the opposite case,
      # so exactly one of the two always runs.
      - name: Export to S3
        if: ${{ secrets.AUDIT_LOG_S3_BUCKET != '' }}
        run: |
          uv sync --no-dev
          uv run python scripts/export_audit_to_s3.py
        env:
          S3_BUCKET: ${{ secrets.AUDIT_LOG_S3_BUCKET }}
          DATABASE_URL: ${{ secrets.AUDIT_LOG_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AUDIT_LOG_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AUDIT_LOG_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AUDIT_LOG_AWS_REGION }}
      - name: Not configured
        if: ${{ secrets.AUDIT_LOG_S3_BUCKET == '' }}
        run: echo "AUDIT_LOG_S3_BUCKET secret not set - skipping export (see this workflow's header comment)"
